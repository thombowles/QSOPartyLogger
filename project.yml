name: QSOPartyLogger
options:
  bundleIdPrefix: org.b5n
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # NOTE: signing stays ad-hoc, deliberately, and it has one visible cost:
    # macOS binds a location grant to the app's code identity, and an ad-hoc
    # signature has none that survives a rebuild. So Contest Setup's Locate
    # button asks for permission again after every `xcodebuild` — the grant
    # is not lost, it no longer matches. Signing Debug with the Apple
    # Development identity (Manual or Automatic, team 3BCPP4AH2D) fixes that
    # and was tried on 2026-08-06: both spellings left the test runner
    # hanging before it could connect to the host app, so the suite is worth
    # more than the convenience. Revisit only with a provisioning profile
    # that the test host can actually launch under.
targets:
  QSOPartyLogger:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Parties
        type: folder
        buildPhase: resources
      - path: Resources/Challenge
        type: folder
        buildPhase: resources
      - path: Resources/DXCC
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.b5n.QSOPartyLogger
        CODE_SIGN_ENTITLEMENTS: Resources/QSOPartyLogger.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Tom Bowles, KE5CW"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: "QSO Party Logger"
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.2.0
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: QSOPartyLogger
        CFBundleDisplayName: QSO Party Logger
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Tom Bowles, KE5CW"
        NSLocalNetworkUsageDescription: "QSO Party Logger connects to your FlexRadio and DX cluster spotting nodes on your local network."
        NSLocationUsageDescription: "Your location fills in your Maidenhead grid square and finds the POTA parks nearest you."
        NSLocationWhenInUseUsageDescription: "Your location fills in your Maidenhead grid square and finds the POTA parks nearest you."
        # qsopartyhub.com serves a self-signed certificate on 443, so the spot
        # tables are reachable over HTTP only. Scoped to that one host — never
        # NSAllowsArbitraryLoads. See docs/research/qsopartyhub.md.
        NSAppTransportSecurity:
          NSExceptionDomains:
            qsopartyhub.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: QSO Party Log
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.b5n.qsopartylogger.log
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.b5n.qsopartylogger.log
            UTTypeDescription: QSO Party Log
            UTTypeConformsTo:
              - public.data
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - qplog
        # ADIF is someone else's format, so imported, not exported. Without
        # this the ⌘E save panel (allowed types drive allowed extensions)
        # renames "KE5CW.adi" to "KE5CW.adi.txt". ADI files are plain text
        # named .adi per the ADIF 3.1.4 spec (adif.org, §Data Formats);
        # .adif is the alternate spelling other loggers emit.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.b5n.qsopartylogger.adif
            UTTypeDescription: ADIF Amateur Radio Log
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - adi
                - adif
    entitlements:
      path: Resources/QSOPartyLogger.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Fills the grid square and sorts the POTA park picker by distance.
        # Asked for only when the operator presses Locate.
        com.apple.security.personal-information.location: true
        com.apple.security.device.serial: true
        com.apple.security.device.usb: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
  QSOPartyLoggerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      # Real captured pages the hub parser is tested against — see
      # docs/research/qsopartyhub.md. Resources, not source.
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: QSOPartyLogger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.b5n.QSOPartyLoggerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QSOPartyLogger.app/Contents/MacOS/QSOPartyLogger"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Runs before the first test and points `Preferences.store` at a
        # throwaway suite. Because the bundle is hosted inside the app above,
        # `UserDefaults.standard` here would otherwise be the operator's real
        # preference domain — see Tests/TestBundleSetup.swift.
        INFOPLIST_KEY_NSPrincipalClass: TestBundleSetup
schemes:
  QSOPartyLogger:
    build:
      targets:
        QSOPartyLogger: all
        QSOPartyLoggerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QSOPartyLoggerTests
